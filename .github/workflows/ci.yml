name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        haxe:
        - latest
        - 5.0.0-preview.1
        - 4.3.7
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install haxe ${{ matrix.haxe }}
        uses: krdlab/setup-haxe@v2.1.1
        with:
          haxe-version: ${{ matrix.haxe }}
      - run: haxe --version
      - name: Setup haxelibs
        run: |
          haxelib dev inotify .
          gh release download --repo HaxeFoundation/hxcpp --pattern 'hxcpp-*.zip' --output hxcpp.zip
          haxelib install hxcpp.zip --always
      - name: Build ndll
        run: haxelib run hxcpp build.xml ndll
      - name: Install hashlink
        # Build only hl and libhl, the bundled hdlls need extra deps (e.g. SDL3)
        run: |
          tag=$(gh release view --repo HaxeFoundation/hashlink --json tagName --jq .tagName)
          git clone --depth 1 --branch "$tag" https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          make -C /tmp/hashlink hl
          cd /tmp/hashlink
          sudo cp hl /usr/local/bin/
          sudo cp libhl.so /usr/local/lib/
          sudo cp src/hl.h src/hl_ffi.h src/hlc.h src/hlc_main.c /usr/local/include/
          sudo ldconfig
      - name: Build hdll
        run: cc -o inotify.hdll -shared -std=c11 -O3 -Wall -m64 -fPIC hlinotify.c -lhl
      - name: Test
        run: test/test.sh
      - name: Build haxedoc.xml
        run: haxe haxedoc.hxml
      - name: Build cpp example
        run: haxe --cwd example/ cpp.hxml
      - name: Build hl example
        run: haxe --cwd example/ hl.hxml
      - name: Build neko example
        run: haxe --cwd example/ neko.hxml
